services:
  - type: worker
    name: bot-pronosticos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: BZZOIRO_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///bot.db
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
